# Baut bei jedem Versions-Tag (z. B. v1.1.0) das Tool (ZIP + exe) und veröffentlicht es als GitHub-Release.
# Das Versand-Tool prüft diese Releases und aktualisiert sich selbst.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:  # Testlauf: baut die exe, veröffentlicht aber kein Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Abhängigkeiten
        run: python -m pip install pyinstaller pypdf "pypdfium2==5.14.0"

      - name: Version aus Tag setzen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content versand_tool.py -Encoding utf8) -replace '^APP_VERSION = ".*?"', "APP_VERSION = `"$v`"" |
            Set-Content versand_tool.py -Encoding utf8
          Select-String -Path versand_tool.py -Pattern '^APP_VERSION'

      # Ordner-Variante (startet ohne Entpacken) als ZIP: exe + _internal liegen direkt im Archiv
      - name: Ordner-Variante bauen
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --hidden-import pypdf --collect-all pypdfium2 --collect-all pypdfium2_raw --distpath dist_ordner --workpath build_ordner --name "BOB-Sendcloud-Versand" versand_tool.py

      - name: ZIP packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "dist_ordner/BOB-Sendcloud-Versand/*" -DestinationPath "dist/BOB-Sendcloud-Versand.zip" -Force

      # Übergangsweise zusätzlich die einzelne exe: Versionen bis 1.0.6 kennen nur diese und stellen danach um
      - name: Einzel-exe bauen
        run: python -m PyInstaller --noconfirm --onefile --windowed --hidden-import pypdf --collect-all pypdfium2 --collect-all pypdfium2_raw --name "BOB-Sendcloud-Versand" versand_tool.py

      # Prüfung: die Ordner-Variante muss die Python-DLL enthalten, sonst startet sie nicht
      - name: Paket prüfen
        shell: pwsh
        run: |
          if (-not (Test-Path "dist_ordner/BOB-Sendcloud-Versand/_internal/python3*.dll")) { throw "python3*.dll fehlt im Paket" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Testlauf-Dateien bereitstellen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: testlauf
          path: |
            dist/BOB-Sendcloud-Versand.zip
            dist/BOB-Sendcloud-Versand.exe
          retention-days: 3

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/BOB-Sendcloud-Versand.zip
            dist/BOB-Sendcloud-Versand.exe
          generate_release_notes: true
